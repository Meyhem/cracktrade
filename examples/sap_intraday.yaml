# A 30-minute strategy on a Xetra-listed stock.
#
# The dates are not decoration. Yahoo serves 15-minute and 30-minute bars for roughly the last
# 55 days and nothing earlier, so this range has to be moved forward to stay fetchable -- a copy
# of this file run in three months is refused, by design, with the limit named. `1h` reaches back
# about two years if you want a window you can leave alone.

strategy:
  name: sap_session_momentum_v1

universe:
  ticker: SAP.DE
  start_date: "2026-07-01"
  end_date: "2026-08-18"
  # 15m | 30m | 1h | 1d. Everything below is counted in *bars*, and a Xetra 30-minute session
  # holds 17 of them.
  interval: 30m

execution:
  initial_capital: 10000.0
  slippage_pct: 0.1
  commission_pct: 0.05

indicators:
  # Windows sized for the session, not for the calendar. 34 bars is two Xetra days; the same
  # number on daily bars would be seven weeks.
  - name: sma_slow
    type: sma
    window: 34
  - name: sma_fast
    type: sma
    window: 8
  - name: rsi_ind
    type: rsi
    window: 14

entry:
  signal: "(close > sma_slow) & (sma_fast > sma_slow) & (rsi_ind < 65)"

exit:
  signal: "close < sma_fast"
  # `max_holding_bars`, never `max_holding_days` -- the `_days` spelling is refused outright on
  # an intraday strategy. 12 bars is most of a session; nothing survives the close anyway, since
  # an intraday position is sold on its session's last bar whatever the rules say.
  max_holding_bars: 12
  stop_loss_pct: 1.5
  take_profit_pct: 2.5
