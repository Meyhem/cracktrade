strategy:
  name: spy_trend_pullback_swing_v1

universe:
  ticker: SPY
  start_date: "2018-01-01"
  end_date: "2026-08-16"

execution:
  initial_capital: 10000.0
  slippage_pct: 0.1
  commission_pct: 0.05
  risk_free_rate: 0.04

indicators:
  - name: sma_trend
    type: sma
    source: close
    window: 150
  - name: rsi_ind
    type: rsi
    source: close
    window: 14

entry:
  signal: "(close > sma_trend) & (rsi_ind < 45)"

exit:
  signal: "close < sma_trend"
  trailing_stop_pct: 6.0
  take_profit_pct: 12.0

position_sizing:
  type: fixed_pct
  value: 100.0
