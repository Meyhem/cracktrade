strategy:
  name: spy_defensive_dip_v1

universe:
  ticker: SPY
  start_date: "2007-01-01"
  end_date: "2026-08-16"

execution:
  initial_capital: 10000.0
  slippage_pct: 0.1
  commission_pct: 0.05
  risk_free_rate: 0.04

indicators:
  - name: sma_trend
    type: sma
    source: close
    window: 200
  - name: rsi_ind
    type: rsi
    source: close
    window: 14
  - name: natr_ind
    type: natr
    window: 14

entry:
  signal: "(close > sma_trend) & (rsi_ind < 40) & (natr_ind < 2.0)"

exit:
  signal: "close < sma_trend"
  atr_stop_multiplier: 2.5
  take_profit_pct: 10.0
  max_holding_days: 40

position_sizing:
  type: fixed_pct
  value: 100.0
