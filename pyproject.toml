[project]
name = "cracktrade"
version = "0.1.0"
description = "Deterministic, look-ahead-free swing-trading backtester and optimizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vectorbt==1.0.0",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "scipy==1.18.0",
    "pandas-ta==0.4.71b0",
    "yfinance>=0.2.40",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pyarrow>=17.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    # api layer -- spec section 15. Loose pins: none of these shapes a result the way the
    # engine's pins do. Anything whose behaviour a result depends on gets an exact pin and a
    # pinning test when it is first relied on.
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
cracktrade = "cracktrade.cli.app:main"
cracktrade-api = "cracktrade.api.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.0",
    "pandas-stubs>=2.2.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cracktrade"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "RET",         # return
    "ARG",         # unused arguments
    "PTH",         # use pathlib
    "TID",         # tidy imports
    "RUF",
    "ANN",         # type annotations
    "BLE",         # blind except  -- defect D10
    "TRY",         # exception antipatterns
    "PD",          # pandas-vet
    "NPY",
]
ignore = [
    "ANN401",      # Any is permitted where genuinely dynamic (yaml payloads)
    "TRY003",      # long messages outside exception class: our errors are user-facing
]

[tool.ruff.format]
exclude = ["docs/*"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG", "PD", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["vectorbt.*", "pandas_ta.*", "yfinance.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that download data or run a full optimization",
    "causality: look-ahead conformance tests",
    "db: tests requiring the compose Postgres (see docker-compose.yml)",
]
# A deprecation warning is how a library announces that behaviour this engine depends on is
# going to change. Printing it in a summary nobody reads is the same as not knowing: the
# starlette/httpx one below sat in every run unnoticed. Warnings fail the suite; each
# exemption is named, bounded to one message, and carries what removes it.
filterwarnings = [
    "error",
    # starlette 1.6 prefers httpx2 and warns when falling back to httpx 0.x. Raised at import
    # of `starlette.testclient`, so it is unreachable from our code. Removed by swapping the
    # dev dependency `httpx` for `httpx2`. Note the category: StarletteDeprecationWarning
    # subclasses UserWarning, not DeprecationWarning, so it survives a -W error::Deprecation-
    # Warning run and has to be named exactly.
    "default:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["src/cracktrade"]
branch = true
