[project]
name = "cracktrade"
version = "0.1.0"
description = "Deterministic, look-ahead-free swing-trading backtester and optimizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vectorbt==1.0.0",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "scipy==1.18.0",
    "pandas-ta==0.4.71b0",
    "yfinance>=0.2.40",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pyarrow>=17.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
cracktrade = "cracktrade.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.0",
    "pandas-stubs>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cracktrade"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "SIM",         # simplify
    "RET",         # return
    "ARG",         # unused arguments
    "PTH",         # use pathlib
    "TID",         # tidy imports
    "RUF",
    "ANN",         # type annotations
    "BLE",         # blind except  -- defect D10
    "TRY",         # exception antipatterns
    "PD",          # pandas-vet
    "NPY",
]
ignore = [
    "ANN401",      # Any is permitted where genuinely dynamic (yaml payloads)
    "TRY003",      # long messages outside exception class: our errors are user-facing
]

[tool.ruff.format]
exclude = ["docs/*"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG", "PD", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["vectorbt.*", "pandas_ta.*", "yfinance.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: tests that download data or run a full optimization",
    "causality: look-ahead conformance tests",
]

[tool.coverage.run]
source = ["src/cracktrade"]
branch = true
